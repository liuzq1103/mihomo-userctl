name: v1
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.10'
            offline_target: ubuntu22.04-x86_64-py310
          - os: ubuntu-24.04
            python: '3.12'
            offline_target: ubuntu24.04-x86_64-py312
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use umask 022 for isolated regression
        run: |
          umask 022
          printf 'umask 022\n' > "$RUNNER_TEMP/mihomoctl-ci-env"
          echo "BASH_ENV=$RUNNER_TEMP/mihomoctl-ci-env" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        id: standard-python
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare build and optional UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-venv python3-pip iproute2 dbus-user-session openssh-server binutils
          /usr/bin/python3 -m venv /tmp/mihomoctl-v1-ci-python
          source /tmp/mihomoctl-v1-ci-python/bin/activate
          echo /tmp/mihomoctl-v1-ci-python/bin >> "$GITHUB_PATH"
          python -c "import sys; assert '.'.join(map(str, sys.version_info[:2])) == '${{ matrix.python }}'"
          python -m pip install pip==25.3 setuptools==80.9.0 wheel==0.45.1 build==1.6.1
          python -m pip install .
          python -m pip install --require-hashes --only-binary=:all: -r scripts/textual-requirements.txt
          python -m pip install ruff==0.17.3 pyright==1.1.414
      - name: Syntax and reviewed-content checks
        run: |
          python scripts/release/version.py --check
          python scripts/ci/generate_interfaces.py --check
          rc=0
          python -m compileall -q mihomoctl scripts tests || rc=$?
          printf 'compileall_rc=%s\n' "$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          ruff check
          pyright
          rc=0
          find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' -print0 | xargs -0 -n1 bash -n || rc=$?
          printf 'bash_syntax_rc=%s\n' "$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          rc=0
          shellcheck -x install.sh uninstall.sh completions/mihomoctl.bash tests/secret-scan.sh || rc=$?
          printf 'shellcheck_rc=%s\n' "$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          rc=0
          python scripts/ci/secret_scan.py || rc=$?
          printf 'secret_scan_rc=%s\n' "$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          rc=0
          git diff --check || rc=$?
          printf 'diff_check_rc=%s\n' "$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
      - name: Fail-closed audit of the documentation and secret gates
        run: |
          rc=0
          bash tests/audit-test.sh || rc=$?
          printf 'audit_rc=%s\n' "$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
      - name: Unit, controller and TUI regression
        run: |
          rc=0
          python scripts/ci/v1_ci.py --unit --report "$RUNNER_TEMP/unit.json" || rc=$?
          printf 'unit_rc=%s\n' "$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
      - name: Prepare pinned real Mihomo binary
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/mihomo.gz" https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-compatible-v1.19.32.gz
          printf '%s  %s\n' ba3ce607747a07f948fc35780e108a4a7c7f552a38b9bd4d115f313ebcb89c20 "$RUNNER_TEMP/mihomo.gz" | sha256sum --check --strict
          gzip --decompress --stdout "$RUNNER_TEMP/mihomo.gz" > "$RUNNER_TEMP/mihomo"
          chmod 755 "$RUNNER_TEMP/mihomo"
          "$RUNNER_TEMP/mihomo" -v
      - name: Real core regression (mandatory)
        run: |
          rc=0
          python scripts/ci/v1_ci.py --real-core --core "$RUNNER_TEMP/mihomo" --report "$RUNNER_TEMP/real-core.json" || rc=$?
          printf 'real_core_rc=%s\n' "$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
      - name: Build exact-commit artifacts and offline wheelhouse
        run: |
          rc=0
          python scripts/release/build_release.py --output dist || rc=$?
          printf 'build_release_rc=%s\n' "$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          python -m pip download --only-binary=:all: --require-hashes -r requirements-lock.txt --dest "$RUNNER_TEMP/wheelhouse"
          cp dist/mihomo_userctl-*.whl "$RUNNER_TEMP/wheelhouse/"
          python -m pip download --only-binary=:all: --dest "$RUNNER_TEMP/python-install-wheelhouse" uv==0.9.5 pipx==1.8.0 setuptools==80.9.0 wheel==0.45.1 pip==25.3
          python -m pip download --only-binary=:all: --require-hashes -r scripts/textual-requirements.txt --dest "$RUNNER_TEMP/python-install-wheelhouse"
          cp "$RUNNER_TEMP/wheelhouse/"*.whl "$RUNNER_TEMP/python-install-wheelhouse/"
      - name: Standard Python install, run, upgrade and uninstall under isolated UIDs
        env:
          STANDARD_PYTHON: ${{ steps.standard-python.outputs.python-path }}
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up; export MIHOMO_V1_DISPOSABLE_VM=1; exec /usr/bin/python3 "$@"' -- scripts/release/verify_python_install.py --artifacts dist --wheelhouse "$RUNNER_TEMP/python-install-wheelhouse" --python "$STANDARD_PYTHON" --report "$RUNNER_TEMP/python-install.json"
          cd dist
          rc=0
          sha256sum --check --strict SHA256SUMS || rc=$?
          printf 'release_checksums_rc=%s\n' "$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
      - name: Build complete target-specific offline kit
        run: |
          rc=0
          python scripts/release/build_offline_bundle.py --artifacts dist --wheelhouse "$RUNNER_TEMP/wheelhouse" --target '${{ matrix.offline_target }}' --output dist || rc=$?
          printf 'build_offline_bundle_rc=%s\n' "$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
      - name: Build complete SSH bundle with pinned Python, Textual and core
        run: |
          python scripts/release/fetch_portable_inputs.py --output "$RUNNER_TEMP/portable-inputs" --previous-bundle
          python -m pip download --only-binary=:all: --require-hashes --python-version 312 --implementation cp --abi cp312 --platform manylinux2014_x86_64 -r scripts/textual-requirements.txt --dest "$RUNNER_TEMP/portable-wheelhouse"
          runtime=$(python -c "import json; print(json.load(open('scripts/release/portable-runtime.json'))['name'])")
          core=$(python -c "import json; print(json.load(open('mihomoctl/mihomo-digests.json'))['pins'][0]['asset'])")
          python scripts/release/build_portable_bundle.py --artifacts dist --runtime "$RUNNER_TEMP/portable-inputs/$runtime" --core "$RUNNER_TEMP/portable-inputs/$core" --wheelhouse "$RUNNER_TEMP/portable-wheelhouse" --output dist
      - name: Exercise SSH bundle offline with distinct user identities
        run: |
          kit=$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*-portable-linux-x86_64.tar.gz' -print)
          sudo unshare --mount --net -- /usr/bin/python3 scripts/release/verify_portable_bundle.py --bundle "$kit" --previous-bundle "$RUNNER_TEMP/portable-inputs/mihomoctl-1.4.0-portable-linux-x86_64.tar.gz" --real-users --require-isolation --ssh-user "$(id -un)" --report "$RUNNER_TEMP/portable-acceptance.json"
      - name: Install, update and recover the delivered kit with networking disabled
        run: |
          kit=$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*-offline-${{ matrix.offline_target }}.tar.gz' -print)
          rc=0
          sudo unshare --net -- sudo -u "$(id -un)" -- "$(command -v python)" "$GITHUB_WORKSPACE/scripts/release/verify_offline_bundle.py" --bundle "$kit" --target '${{ matrix.offline_target }}' --python "$(command -v python)" --report "$RUNNER_TEMP/offline-bundle-install.json" || rc=$?
          printf 'verify_offline_bundle_rc=%s\n' "$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
      - name: Offline install, update and self-contained recovery of full artifacts
        run: |
          mkdir -m 700 "$RUNNER_TEMP/previous-source"
          git archive 60cd461eec63d762660290d745e67729683420f9 | tar -x -C "$RUNNER_TEMP/previous-source"
          rc=0
          python scripts/release/verify_artifact_install.py --artifacts dist --wheelhouse "$RUNNER_TEMP/wheelhouse" --python "$(command -v python)" --previous-source "$RUNNER_TEMP/previous-source" --report "$RUNNER_TEMP/artifact-install.json" || rc=$?
          printf 'verify_artifact_install_rc=%s\n' "$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
      - name: Release acquisition and upgrade contracts with networking disabled
        run: |
          sudo unshare --net -- sudo -u "$(id -un)" -- "$(command -v python)" "$GITHUB_WORKSPACE/scripts/ci/v1_ci.py" --unit --pattern test_v1_release.py --pattern test_v1_release_fetch.py --report "$RUNNER_TEMP/release-acquisition.json"
      - name: Real users, systemd and isolated TUN (mandatory)
        run: |
          sudo modprobe tun || true
          sudo mkdir -p /dev/net
          if [ ! -e /dev/net/tun ]; then sudo mknod /dev/net/tun c 10 200; sudo chmod 666 /dev/net/tun; fi
          rc=0
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin MIHOMO_V1_DISPOSABLE_VM=1 /usr/bin/python3 scripts/ci/v1_ci.py --privileged --core "$RUNNER_TEMP/mihomo" --wheelhouse "$RUNNER_TEMP/wheelhouse" --report "$RUNNER_TEMP/privileged.json" || rc=$?
          printf 'privileged_rc=%s\n' "$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
      - name: Documentation links
        run: |
          rc=0
          python scripts/ci/check_docs_v1.py || rc=$?
          printf 'docs_rc=%s\n' "$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/unit.json
            ${{ runner.temp }}/real-core.json
            ${{ runner.temp }}/privileged.json
            ${{ runner.temp }}/artifact-install.json
            ${{ runner.temp }}/python-install.json
            ${{ runner.temp }}/offline-bundle-install.json
            ${{ runner.temp }}/release-acquisition.json
            ${{ runner.temp }}/portable-acceptance.json
          if-no-files-found: error
      - name: Upload exact-commit release candidates
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
      - name: Upload secondary build proof and target-specific kit
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ matrix.os }}
          path: |
            dist/*-offline-*.tar.gz
            dist/*-offline-*.tar.gz.sha256
            dist/*-portable-*.tar.gz.sha256
            dist/build-receipt.json
          if-no-files-found: error
  release-gate:
    needs: ubuntu
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: validation-ubuntu-*
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: release-candidate-ubuntu-*
          path: candidates
      - name: Assemble both offline kits without replacing normal release assets
        run: |
          mkdir offline
          cp candidates/release-candidate-ubuntu-*/*-offline-*.tar.gz offline/
          cp candidates/release-candidate-ubuntu-*/*-offline-*.tar.gz.sha256 offline/
      - name: Require exact-commit artifacts and both target acceptance sets
        run: |
          umask 022
          rc=0
          python3 scripts/release/verify_release.py --artifacts candidates/release-candidate-ubuntu-22.04 --offline-artifacts offline --evidence evidence --commit "$GITHUB_SHA" > release-gate.json || rc=$?
          printf 'verify_release_rc=%s\n' "$rc"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          python3 -c "import json; from pathlib import Path; a=json.loads(Path('candidates/release-candidate-ubuntu-24.04/build-receipt.json').read_text()); b=json.loads(Path('candidates/release-candidate-ubuntu-22.04/build-receipt.json').read_text()); assert all(a[k]==b[k] for k in ('commit','version','source_epoch','source','publishable')); e=json.loads(Path('evidence/validation-ubuntu-24.04/artifact-install.json').read_text()); assert a['sha256']==e['artifact_sha256']"
          cmp candidates/release-candidate-ubuntu-22.04/*-portable-*.sha256 candidates/release-candidate-ubuntu-24.04/*-portable-*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: release-gate
          path: release-gate.json
          if-no-files-found: error
