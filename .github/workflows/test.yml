name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck python3-yaml
      - name: Bash syntax
        run: find . -type f \( -name '*.sh' -o -name '*.bash' -o -name mihomoctl \) -print0 | xargs -0 -n1 bash -n
      - name: ShellCheck
        run: shellcheck -x src/common.bash src/mihomoctl src/shell.bash install.sh uninstall.sh completions/mihomoctl.bash scripts/*.sh tests/*.sh
      - name: Tests
        run: bash tests/test.sh
      - name: Acceptance and update regression tests (isolated, no live service)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Audit tool failure regression tests
        run: bash tests/audit-test.sh
      - name: Documentation structure and links
        run: bash tests/docs-test.sh
      - name: Secret scan
        run: bash tests/secret-scan.sh
      - name: Whitespace
        run: git diff --check
  textual:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare hash-locked optional UI and offline wheels
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/textual-requirements.txt
          python -m pip download --require-hashes --only-binary=:all: -r scripts/textual-requirements.txt -d "$RUNNER_TEMP/tui-wheels"
          chmod 700 "$RUNNER_TEMP/tui-wheels"
      - name: Optional frontend, services and offline installer
        env:
          MIHOMO_TEST_WHEELHOUSE: ${{ runner.temp }}/tui-wheels
        run: |
          python -m unittest discover -s tests -p test_textual.py -v
          python -m unittest discover -s tests -p test_console.py -v
          python -m unittest discover -s tests -p test_tasks.py -v
          python -m unittest discover -s tests -p test_update.py -k optional_textual -v
