name: v1
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.10'
            offline_target: ubuntu22.04-x86_64-py310
          - os: ubuntu-24.04
            python: '3.12'
            offline_target: ubuntu24.04-x86_64-py312
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare build and optional UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-venv iproute2 dbus-user-session
          /usr/bin/python3 -m venv /tmp/mihomoctl-v1-ci-python
          source /tmp/mihomoctl-v1-ci-python/bin/activate
          echo /tmp/mihomoctl-v1-ci-python/bin >> "$GITHUB_PATH"
          python -c "import sys; assert '.'.join(map(str, sys.version_info[:2])) == '${{ matrix.python }}'"
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install .
          python -m pip install --require-hashes --only-binary=:all: -r scripts/textual-requirements.txt
      - name: Syntax and reviewed-content checks
        run: |
          python -m compileall -q mihomoctl scripts tests
          find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
          shellcheck -x install.sh uninstall.sh completions/mihomoctl.bash tests/secret-scan.sh
          python scripts/secret_scan.py
          git diff --check
      - name: Fail-closed audit of the documentation and secret gates
        run: bash tests/audit-test.sh
      - name: Unit, controller and TUI regression
        run: python scripts/v1_ci.py --unit --report "$RUNNER_TEMP/unit.json"
      - name: Prepare pinned real Mihomo binary
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/mihomo.gz" https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-compatible-v1.19.32.gz
          printf '%s  %s\n' ba3ce607747a07f948fc35780e108a4a7c7f552a38b9bd4d115f313ebcb89c20 "$RUNNER_TEMP/mihomo.gz" | sha256sum --check --strict
          gzip --decompress --stdout "$RUNNER_TEMP/mihomo.gz" > "$RUNNER_TEMP/mihomo"
          chmod 755 "$RUNNER_TEMP/mihomo"
          "$RUNNER_TEMP/mihomo" -v
      - name: Real core regression (mandatory)
        run: python scripts/v1_ci.py --real-core --core "$RUNNER_TEMP/mihomo" --report "$RUNNER_TEMP/real-core.json"
      - name: Build exact-commit artifacts and offline wheelhouse
        run: |
          python scripts/build_release.py --output dist
          python -m pip download --only-binary=:all: --require-hashes -r requirements-lock.txt --dest "$RUNNER_TEMP/wheelhouse"
          cp dist/mihomoctl-*.whl "$RUNNER_TEMP/wheelhouse/"
          cd dist
          sha256sum --check --strict SHA256SUMS
      - name: Build complete target-specific offline kit
        run: python scripts/build_offline_bundle.py --artifacts dist --wheelhouse "$RUNNER_TEMP/wheelhouse" --target '${{ matrix.offline_target }}' --output dist
      - name: Install, update and recover the delivered kit with networking disabled
        run: |
          kit=$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*-offline-${{ matrix.offline_target }}.tar.gz' -print)
          sudo unshare --net -- sudo -u "$(id -un)" -- "$(command -v python)" "$GITHUB_WORKSPACE/scripts/verify_offline_bundle.py" --bundle "$kit" --target '${{ matrix.offline_target }}' --python "$(command -v python)" --report "$RUNNER_TEMP/offline-bundle-install.json"
      - name: Offline install, update and self-contained recovery of full artifacts
        run: python scripts/verify_artifact_install.py --artifacts dist --wheelhouse "$RUNNER_TEMP/wheelhouse" --python "$(command -v python)" --report "$RUNNER_TEMP/artifact-install.json"
      - name: Real users, systemd and isolated TUN (mandatory)
        run: |
          sudo modprobe tun || true
          sudo mkdir -p /dev/net
          if [ ! -e /dev/net/tun ]; then sudo mknod /dev/net/tun c 10 200; sudo chmod 666 /dev/net/tun; fi
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin MIHOMO_V1_DISPOSABLE_VM=1 /usr/bin/python3 scripts/v1_ci.py --privileged --core "$RUNNER_TEMP/mihomo" --wheelhouse "$RUNNER_TEMP/wheelhouse" --report "$RUNNER_TEMP/privileged.json"
      - name: Documentation links
        run: python scripts/check_docs_v1.py
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/unit.json
            ${{ runner.temp }}/real-core.json
            ${{ runner.temp }}/privileged.json
            ${{ runner.temp }}/artifact-install.json
            ${{ runner.temp }}/offline-bundle-install.json
          if-no-files-found: error
      - name: Upload exact-commit release candidates
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
  release-gate:
    needs: ubuntu
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: validation-ubuntu-*
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: release-candidate-ubuntu-*
          path: candidates
      - name: Assemble both offline kits without replacing normal release assets
        run: |
          mkdir offline
          cp candidates/release-candidate-ubuntu-*/*-offline-*.tar.gz offline/
          cp candidates/release-candidate-ubuntu-*/*-offline-*.tar.gz.sha256 offline/
      - name: Require exact-commit artifacts and both target acceptance sets
        run: python3 scripts/verify_release.py --artifacts candidates/release-candidate-ubuntu-22.04 --offline-artifacts offline --evidence evidence --commit "$GITHUB_SHA" > release-gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-gate
          path: release-gate.json
          if-no-files-found: error
