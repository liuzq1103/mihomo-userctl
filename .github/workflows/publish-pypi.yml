name: Verify or publish gated Python distributions
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main push run of test.yml
        required: true
        type: string
      publish:
        description: Upload a stable version (requires separate release authorization)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: mihomo-userctl-pypi
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve exact successful main CI run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          run_id = os.environ['RUN_ID']
          assert run_id.isdecimal()
          repo = os.environ['GITHUB_REPOSITORY']
          run = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + '/actions/runs/' + run_id]))
          assert run['repository']['full_name'] == repo
          assert run['head_branch'] == 'main' and run['event'] == 'push'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['path'] == '.github/workflows/test.yml'
          assert re.fullmatch('[0-9a-f]{40}', run['head_sha'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + run['head_sha'] + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          path: dist/pypi-ci
      - name: Recheck all evidence and select exact wheel and sdist
        env:
          EXPECTED_COMMIT: ${{ steps.source.outputs.sha }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python3 -m venv "$RUNNER_TEMP/pypi-validator"
          "$RUNNER_TEMP/pypi-validator/bin/pip" install --require-hashes -r requirements-lock.txt
          args=()
          if [ "$PUBLISH" = true ]; then args+=(--publishing); fi
          "$RUNNER_TEMP/pypi-validator/bin/python" scripts/release/prepare_pypi.py --download dist/pypi-ci --output dist/pypi --commit "$EXPECTED_COMMIT" "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-python-distributions
          path: dist/pypi/python/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-verification
          path: dist/pypi/pypi-verification.json
          if-no-files-found: error
  publish:
    if: ${{ inputs.publish }}
    needs: verify
    runs-on: ubuntu-22.04
    # Maintainer must configure the PyPI pending publisher and protect this
    # GitHub environment with required reviewers before enabling publication.
    environment:
      name: pypi
      url: https://pypi.org/p/mihomo-userctl
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
