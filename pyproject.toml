[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mihomoctl"
version = "1.1.1"
description = "User-level Mihomo runtime manager: proxy profiles, environment injection, runtime integration, health checks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0.1"]
authors = [{ name = "mihomo-userctl maintainers" }]

[project.optional-dependencies]
tui = ["textual>=0.40"]

[project.scripts]
mihomoctl = "mihomoctl.cli:main"

[tool.setuptools]
packages = ["mihomoctl", "mihomoctl.lifecycle", "mihomoctl.integration", "mihomoctl.controller"]

[tool.setuptools.package-data]
mihomoctl = ["mihomo-digests.json"]
"mihomoctl.controller" = ["dashboard.html"]

[tool.setuptools.cmdclass]
build_py = "scripts.release.build_backend.ReviewedBuildPy"

[tool.pytest.ini_options]
testpaths = ["tests"]
